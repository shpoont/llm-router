<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every required ability must pass.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

.node-name { font-family: var(--font-sans); font-size: 16px; font-weight: 600; fill: #2d3142; }
.body-copy { font-family: var(--font-sans); font-size: 16px; font-weight: 400; fill: #2d3142; }
.sublabel { font-family: var(--font-mono); font-size: 12px; fill: #4f5d75; }
.title-text { font-family: var(--font-serif); font-size: 40px; font-weight: 400; fill: #2d3142; }
.eyebrow-text { font-family: var(--font-mono); font-size: 8px; font-weight: 500; fill: #4f5d75; letter-spacing: .14em; }
.legend-text { font-family: var(--font-mono); font-size: 11px; fill: #4f5d75; }

  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Worked comparison · Diagram Design</p>
    <h1>Every required ability must pass.</h1>


    <div class="diagram-container">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-independent-requirements-title 02-independent-requirements-desc">
<title id="02-independent-requirements-title">Every required ability must pass.</title>
<desc id="02-independent-requirements-desc">An invented math and coding example excludes failing or missing benchmark evidence, then chooses B because it is cheaper than the other eligible offering C.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="80" class="title-text" text-anchor="start">Every required ability must pass.</text>
<text x="48" y="124" class="body-copy" text-anchor="start">Example: the latest request needs mathematics and programming. Each benchmark floor is 85.</text>
<path data-edge="B:choice" data-source="B" data-target="choice" d="M 832 344 H 944" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="96" y="216" class="node-name" text-anchor="middle">Model</text>
<text x="224" y="216" class="node-name" text-anchor="middle">Math ≥ 85</text>
<text x="384" y="216" class="node-name" text-anchor="middle">Coding ≥ 85</text>
<text x="520" y="216" class="node-name" text-anchor="middle">Cost units</text>
<text x="704" y="216" class="node-name" text-anchor="middle">Result</text>
<line x1="48" y1="232" x2="832" y2="232" stroke="#2d3142" stroke-opacity="0.18"/>
<g data-node="A" data-x="48" data-y="252" data-w="784" data-h="56">
<rect x="48" y="252" width="784" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
<text x="96" y="286" class="body-copy" text-anchor="middle">A</text>
<text x="224" y="286" class="body-copy" text-anchor="middle">94</text>
<text x="384" y="286" class="body-copy" text-anchor="middle">65 (fails)</text>
<text x="520" y="286" class="body-copy" text-anchor="middle">1</text>
<text x="704" y="286" class="body-copy" text-anchor="middle">Excluded</text>
</g>
<g data-node="B" data-x="48" data-y="316" data-w="784" data-h="56">
<rect x="48" y="316" width="784" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-opacity="1" stroke-width="1.2"/>
<text x="96" y="350" class="node-name" text-anchor="middle">B</text>
<text x="224" y="350" class="node-name" text-anchor="middle">87</text>
<text x="384" y="350" class="node-name" text-anchor="middle">88</text>
<text x="520" y="350" class="node-name" text-anchor="middle">3</text>
<text x="704" y="350" class="node-name" text-anchor="middle">Eligible, cheapest</text>
</g>
<g data-node="C" data-x="48" data-y="380" data-w="784" data-h="56">
<rect x="48" y="380" width="784" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
<text x="96" y="414" class="body-copy" text-anchor="middle">C</text>
<text x="224" y="414" class="body-copy" text-anchor="middle">94</text>
<text x="384" y="414" class="body-copy" text-anchor="middle">95</text>
<text x="520" y="414" class="body-copy" text-anchor="middle">10</text>
<text x="704" y="414" class="body-copy" text-anchor="middle">Eligible</text>
</g>
<g data-node="D" data-x="48" data-y="444" data-w="784" data-h="56">
<rect x="48" y="444" width="784" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
<text x="96" y="478" class="body-copy" text-anchor="middle">D</text>
<text x="224" y="478" class="body-copy" text-anchor="middle">95</text>
<text x="384" y="478" class="body-copy" text-anchor="middle">Unknown</text>
<text x="520" y="478" class="body-copy" text-anchor="middle">2</text>
<text x="704" y="478" class="body-copy" text-anchor="middle">Excluded</text>
</g>
<g data-node="choice" data-x="944" data-y="284" data-w="288" data-h="120">
<rect x="944" y="284" width="288" height="120" rx="6" fill="#f5f5f5"/>
<rect x="944" y="284" width="288" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
<text x="1088.0" y="328" class="node-name" text-anchor="middle">Choose B</text>
<text x="1088.0" y="352" class="sublabel" text-anchor="middle">Lowest forecast among</text>
<text x="1088.0" y="376" class="sublabel" text-anchor="middle">eligible candidates</text>
</g>
<text x="48" y="560" class="body-copy" text-anchor="start">High math scores cannot compensate for failing or missing coding evidence.</text>
<text x="48" y="600" class="sublabel" text-anchor="start">Invented scores and costs; operational checks and evidence applicability are assumed.</text>
<line x1="48" y1="652" x2="1232" y2="652" stroke="#2d3142" stroke-opacity="0.12"/>
<text x="48" y="684" class="legend-text" text-anchor="start">Orange: selected offering</text>
<text x="336" y="684" class="legend-text" text-anchor="start">Cost units = next-call forecast</text>
<text x="672" y="684" class="legend-text" text-anchor="start">Benchmark eligibility is not an answer-quality guarantee.</text>
</svg>
    </div>
  </div>
</body>
</html>
