<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconsider the model on every turn.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

.node-name { font-family: var(--font-sans); font-size: 16px; font-weight: 600; fill: #2d3142; }
.body-copy { font-family: var(--font-sans); font-size: 16px; font-weight: 400; fill: #2d3142; }
.sublabel { font-family: var(--font-mono); font-size: 12px; fill: #4f5d75; }
.title-text { font-family: var(--font-serif); font-size: 40px; font-weight: 400; fill: #2d3142; }
.eyebrow-text { font-family: var(--font-mono); font-size: 8px; font-weight: 500; fill: #4f5d75; letter-spacing: .14em; }
.legend-text { font-family: var(--font-mono); font-size: 11px; fill: #4f5d75; }

  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Conversation timeline · Diagram Design</p>
    <h1>Reconsider the model on every turn.</h1>


    <div class="diagram-container">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-per-turn-routing-title 03-per-turn-routing-desc">
<title id="03-per-turn-routing-title">Reconsider the model on every turn.</title>
<desc id="03-per-turn-routing-desc">Three hypothetical conversation turns require writing, arithmetic and formatting respectively, and the same selection rules may choose different models at each new turn while using history as context.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="80" class="title-text" text-anchor="start">Reconsider the model on every turn.</text>
<text x="48" y="124" class="body-copy" text-anchor="start">Use the history for context; classify what the latest request requires.</text>
<line x1="80" y1="212" x2="1200" y2="212" stroke="#4f5d75" stroke-width="1"/>
<line x1="240" y1="212" x2="240" y2="272" stroke="#4f5d75" stroke-width="1"/>
<circle cx="240" cy="212" r="4" fill="#2d3142"/>
<text x="240" y="184" class="sublabel" text-anchor="middle">TURN 1</text>
<line x1="640" y1="212" x2="640" y2="272" stroke="#4f5d75" stroke-width="1"/>
<circle cx="640" cy="212" r="6" fill="#bf4520"/>
<text x="640" y="184" class="sublabel" text-anchor="middle" style="fill:#bf4520">TURN 2</text>
<line x1="1040" y1="212" x2="1040" y2="272" stroke="#4f5d75" stroke-width="1"/>
<circle cx="1040" cy="212" r="4" fill="#2d3142"/>
<text x="1040" y="184" class="sublabel" text-anchor="middle">TURN 3</text>
<g data-node="turn-1" data-x="80" data-y="272" data-w="320" data-h="256">
<rect x="80" y="272" width="320" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="104" y="304" class="sublabel" text-anchor="start">Latest request</text>
<text x="104" y="336" class="node-name" text-anchor="start">Draft an email about this.</text>
<text x="104" y="384" class="sublabel" text-anchor="start">Required abilities</text>
<text x="104" y="416" class="body-copy" text-anchor="start">Writing + context</text>
<text x="104" y="464" class="sublabel" text-anchor="start">Cheapest eligible choice</text>
<text x="104" y="496" class="node-name" text-anchor="start">Model X</text>
</g>
<g data-node="turn-2" data-x="480" data-y="272" data-w="320" data-h="256">
<rect x="480" y="272" width="320" height="256" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
<text x="504" y="304" class="sublabel" text-anchor="start">Latest request</text>
<text x="504" y="336" class="node-name" text-anchor="start">Calculate these totals.</text>
<text x="504" y="384" class="sublabel" text-anchor="start">Required abilities</text>
<text x="504" y="416" class="body-copy" text-anchor="start">Arithmetic + context</text>
<text x="504" y="464" class="sublabel" text-anchor="start">Cheapest eligible choice</text>
<text x="504" y="496" class="node-name" text-anchor="start">Model Y</text>
</g>
<g data-node="turn-3" data-x="880" data-y="272" data-w="320" data-h="256">
<rect x="880" y="272" width="320" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="904" y="304" class="sublabel" text-anchor="start">Latest request</text>
<text x="904" y="336" class="node-name" text-anchor="start">Return that as JSON.</text>
<text x="904" y="384" class="sublabel" text-anchor="start">Required abilities</text>
<text x="904" y="416" class="body-copy" text-anchor="start">Formatting + context</text>
<text x="904" y="464" class="sublabel" text-anchor="start">Cheapest eligible choice</text>
<text x="904" y="496" class="node-name" text-anchor="start">Model X</text>
</g>
<text x="48" y="580" class="body-copy" text-anchor="start">Apply the same published-evidence and price rules for each turn.</text>
<text x="48" y="616" class="body-copy" text-anchor="start">Keep the chosen model through that turn’s tool loop.</text>
<line x1="48" y1="652" x2="1232" y2="652" stroke="#2d3142" stroke-opacity="0.12"/>
<text x="48" y="684" class="legend-text" text-anchor="start">Ordinal turns, not elapsed time</text>
<text x="360" y="684" class="legend-text" text-anchor="start">Orange: a changed selection</text>
<text x="660" y="684" class="legend-text" text-anchor="start">Illustrative choices; assume suitable evidence and forecasts.</text>
</svg>
    </div>
  </div>
</body>
</html>
